name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm test

      # Project sites are served from https://<user>.github.io/<repo>/ → basePath "/<repo>".
      # A repo named <user>.github.io is a user site served from "/" → empty basePath.
      - name: Resolve basePath
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then echo "path=" >> "$GITHUB_OUTPUT"; else echo "path=/$repo" >> "$GITHUB_OUTPUT"; fi

      # Alignment server: the code defaults to the live Cloud Run service
      # (DEFAULT_ALIGNMENT_API_URL in src/lib/speech/engine.ts). The repository variable
      # ALIGNMENT_API_URL (Settings → Secrets and variables → Actions → Variables) overrides it
      # for the deployed app; it is only exported when set so an empty variable cannot blank it.
      - name: Alignment server override
        if: vars.ALIGNMENT_API_URL != ''
        run: echo "NEXT_PUBLIC_ALIGNMENT_API_URL=${{ vars.ALIGNMENT_API_URL }}" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
