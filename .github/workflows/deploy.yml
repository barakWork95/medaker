name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, typecheck, test
        run: |
          npm run lint
          npm run typecheck
          npm test

      # Project sites are served from https://<user>.github.io/<repo>/ → basePath "/<repo>".
      # A repo named <user>.github.io is a user site served from "/" → empty basePath.
      - name: Resolve basePath
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then echo "path=" >> "$GITHUB_OUTPUT"; else echo "path=/$repo" >> "$GITHUB_OUTPUT"; fi

      # Alignment server (Phase 4): set the repository variable ALIGNMENT_API_URL
      # (Settings → Secrets and variables → Actions → Variables) to e.g. https://medaker-aligner.onrender.com
      # and the deployed app uses the remote engine with no per-device setup.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_ALIGNMENT_API_URL: ${{ vars.ALIGNMENT_API_URL }}
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
